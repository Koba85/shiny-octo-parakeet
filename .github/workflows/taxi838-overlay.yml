name: Build Taxi838 Overlay APK

on:
  push:
    branches:
      - taxi838-overlay-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: taxi838-overlay
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp taxi838-overlay/app/build/outputs/apk/debug/app-debug.apk Taxi838-Overlay.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taxi838-Overlay-APK
          path: Taxi838-Overlay.apk
          if-no-files-found: error
