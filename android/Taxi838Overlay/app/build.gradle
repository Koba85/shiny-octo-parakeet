plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.kobets.taxi838overlay'
    compileSdk 35

    defaultConfig {
        applicationId 'ua.kobets.taxi838overlay'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
